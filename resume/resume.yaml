projects:
  - name: "Best EU League"
    description: "A data-driven project to identify the best European football league over the past 3 to 5 years, for a broadcaster’s sports streaming package."
    disposition: page1
    highlights:
      - "Built an ETL pipeline to extract, transform, and store data from official league websites (Ligue 1, Bundesliga, Serie A, Premier League)."
      - "Conducted data preprocessing and feature engineering, calculating metrics such as win percentage and goals per game."
      - "Developed a predictive model using RandomForestRegressor to rank leagues based on aggregated performance metrics, with hyperparameter tuning for accuracy."
      - "Created data visualizations (bar charts, box plots) using Matplotlib and Seaborn to analyze key league statistics, including average goals per game and win rates."
    keywords:
      - Python
      - Web Scraping
      - API Scraping
      - Numpy
      - Matplotlib
      - Sklearn
      - Seaborn
      - Pandas
      - ETL
      - Data Analysis
      - Machine Learning
      
  - name: "HostIt: Scalable Cloud Hosting Platform"
    description: "Developed a highly available and scalable cloud storage platform designed for non-technical users, using a microservices architecture."
    disposition: page1
    highlights:
      - "Built a Kubernetes (K3s) cluster for scalability and high availability."
      - "Implemented secure user authentication and registration features."
      - "Developed a Flutter frontend with drag-and-drop file upload, file search, and sorting capabilities."
      - "Deployed Spring Boot microservices with MinIO for object storage and NGINX as a reverse proxy."
      - "Enabled file viewing in browser tabs and optimized performance for seamless user experience."
    keywords:
      - Kubernetes
      - Docker
      - TrueNAS
      - MinIO
      - Spring Boot
      - NGINX
      - Flutter
      - Microservices
      - SQL
      - RestTemplate
      - Authentication
      - File Management
      - Scalability
    startDate: "2024-01-01"
    endDate: "2024-12-31"

  - name: "Real-Time Car Accident Detection System"
    description: "Developed an intelligent system for real-time car accident detection using video feeds, aimed at reducing emergency response times for the city of Brussels."
    disposition: page1
    highlights:
      - "Preprocessed and cleaned video data, extracting key features to detect unusual driving behaviors associated with accidents."
      - "Trained a machine learning classification model using neural networks to identify accident patterns in live video streams."
      - "Integrated the model into a real-time processing pipeline to continuously monitor video feeds and trigger alerts for emergency services upon detection of an accident."
      - "Evaluated model performance with accuracy, precision, and recall metrics, ensuring reliable detection in various traffic conditions."
    keywords:
      - Python
      - OpenCV
      - TensorFlow
      - Neural Networks
      - Video Processing
      - Data Preprocessing
      - Feature Engineering
      - Machine Learning
      - Real-Time Detection
      - Classification Model
  
  - name: "LinkedIn Clone"
    description: "Developed a full-stack LinkedIn clone to practice and apply modern web development techniques using a microservices architecture."
    disposition: page1
    highlights:
      - "Built a responsive frontend using React with a focus on user experience and performance."
      - "Developed backend microservices with Spring Boot for scalable API management."
      - "Utilized Docker for containerization, ensuring consistent deployment across different environments."
      - "Implemented features such as user authentication, profile management, and a dynamic feed."
      - "Employed REST APIs for seamless communication between frontend and backend services."
    keywords:
      - ReactJS
      - Spring Boot
      - Microservices
      - Docker
      - RestTemplate
      - REST API
      - SQL
      - Containerization
      - Authentication
      - Web Development
    startDate: "2024-01-01"
    endDate: "2024-12-31"


