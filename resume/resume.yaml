    description: Fullstack development in Flutter and Laravel
    startDate: "2023-11-01"
    endDate: "2024-03-01"
    methodology: Agile/Scrum
    summary: >-
      Contributed to the development of a web and mobile application designed to facilitate 
      communication between agents, clubs, and football players. Built with [Flutter](https://flutter.dev/) for the 
      interfaces and [Laravel](https://laravel.com/) for the backend, the application provided access to detailed player statistics 
      while securing sensitive information, such as contact details. Agents could also manage their connections 
      with athletes within the platform. An external API was used to retrieve up-to-date stats on players, leagues, 
      and clubs.
    highlights:
      - Fullstack development using Flutter for mobile and Laravel for backend.
      - Integrated a third-party API for retrieving player, league, and club statistics.
      - Ensured secure access to player data while protecting sensitive information.
      - Used [Docker](https://www.docker.com/) for containerization and [Gitea](https://about.gitea.com/) for version control and collaboration.

    technologies:
      - Laravel
      - Flutter
      - Docker
      - Git/Gitea 
      - MariaDB
      - REST API
      - Agile/Scrum 
      - Trello
